:root{

  --muted:#8b93a7; --text:#eef1f7; --gold:#d8b45a; --gold-2:#f0d488; --accent:#7fd7e0; --good:#5ad1a0; --bad:#f06a6a;

}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
html,body{height:100%}
body{color:var(--text);background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.7}
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:

  radial-gradient(1000px 700px at 95% 0%, #23182f 0%, transparent 50%),
  linear-gradient(180deg,#0a0b0f 0%, #06070b 100%);}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;mix-blend-mode:screen;animation:float 18s ease-in-out infinite}
.orb.o1{width:520px;height:520px;background:radial-gradient(circle at 30% 30%,#c8a951,#6b4f18 60%,transparent);top:-120px;right:-80px}
.orb.o2{width:460px;height:460px;background:radial-gradient(circle at 30% 30%,#7fd7e0,#173b3e 60%,transparent);bottom:-140px;left:-100px;animation-delay:-6s}
.orb.o3{width:380px;height:380px;background:radial-gradient(circle at 30% 30%,#8b7bff,#221a4a 60%,transparent);top:40%;left:45%;animation-delay:-11s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-30px,40px) scale(1.08)}66%{transform:translate(40px,-30px) scale(.94)}}
.wrap{max-width:1240px;margin:0 auto;padding:18px 18px 60px}

.header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-radius:var(--r);
  background:linear-gradient(120deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--stroke);
  box-shadow:var(--shadow-soft);backdrop-filter:blur(14px);position:sticky;top:12px;z-index:50}
.brand{display:flex;gap:14px;align-items:center}
.brand .logo{width:50px;height:50px;border-radius:14px;object-fit:cover;border:1px solid var(--stroke-2)}
.brand .t1{font-weight:900;font-size:1.1rem;letter-spacing:.3px;background:linear-gradient(90deg,var(--gold-2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .t2{color:var(--muted);font-size:.78rem}
.hc{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-weight:800;font-size:.8rem;border:1px solid var(--stroke-2);background:rgba(255,255,255,.04)}
.badge.free{color:var(--accent)} .badge.pro{color:#081217;background:linear-gradient(90deg,var(--gold),var(--gold-2));border:none}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.btn{position:relative;padding:10px 16px;border-radius:13px;border:1px solid var(--stroke-2);font-weight:800;cursor:pointer;color:var(--text);background:rgba(255,255,255,.05);transition:transform .12s,box-shadow .2s,background .2s;font-size:.9rem}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px rgba(0,0,0,.7)} .btn:active{transform:translateY(1px)}
.btn.sm{padding:7px 12px;font-size:.8rem;border-radius:11px}
.btn.primary{background:linear-gradient(90deg,var(--gold),var(--gold-2));color:#0a0a0a;border:none}
.btn.accent{background:linear-gradient(90deg,var(--accent),#57bfc9);color:#04222a;border:none}
.btn.ghost{background:transparent;color:var(--muted)} .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.langsel{padding:8px 10px;border-radius:11px;background:rgba(0,0,0,.25);border:1px solid var(--stroke);color:var(--text);font-size:.82rem;cursor:pointer}

/* intro */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;
  background:radial-gradient(900px 600px at 50% 20%, #17203a 0%, transparent 60%),linear-gradient(180deg,#0a0b0f,#06070b)}
.intro-card{width:640px;max-width:100%;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--stroke);border-radius:var(--r-lg);box-shadow:var(--shadow);backdrop-filter:blur(16px);padding:40px 34px}
.intro-card .logo{width:96px;height:96px;border-radius:24px;object-fit:cover;border:1px solid var(--stroke-2);box-shadow:0 12px 40px rgba(0,0,0,.6);animation:float2 5s ease-in-out infinite}
@keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.intro-card h1{margin-top:22px;font-size:2.3rem;font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,var(--gold-2),var(--gold),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.intro-card .desc{margin-top:14px;color:#cfd5e2;font-size:1.02rem;line-height:1.7}
.intro-lang{margin:26px auto 6px;max-width:360px}
.intro-lang label{display:block;color:var(--muted);font-size:.82rem;margin-bottom:8px;font-weight:700}
.intro-lang select{width:100%;padding:13px 14px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--stroke-2);color:var(--text);font-size:1rem;cursor:pointer}
.intro .go{margin-top:20px;width:100%;max-width:360px;padding:15px;font-size:1.05rem}
.intro .foot{margin-top:20px;color:var(--muted);font-size:.72rem}

/* generic */
.hero{margin-top:22px;text-align:center;padding:16px 10px 4px}
.hero h2{font-size:clamp(1.5rem,3.6vw,2.4rem);font-weight:900;line-height:1.25}
.hero h2 .g{background:linear-gradient(90deg,var(--gold-2),var(--gold),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);max-width:640px;margin:10px auto 0}
.card{background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid var(--stroke);border-radius:var(--r-lg);box-shadow:var(--shadow);backdrop-filter:blur(16px);padding:22px;position:relative;margin-top:22px}
.section-title{font-weight:900;font-size:1.12rem}
.section-sub{color:var(--muted);font-size:.88rem;margin-top:4px}
.search{width:100%;padding:13px 16px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--stroke);color:var(--text);font-size:.95rem;margin-top:16px}
.search:focus{outline:none;border-color:var(--gold)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:18px}
.cat{padding:16px 14px;border-radius:18px;cursor:pointer;text-align:center;background:linear-gradient(165deg,rgba(255,255,255,.06),rgba(255,255,255,.015));border:1px solid var(--stroke);transition:transform .18s,box-shadow .25s,border-color .2s}
.cat:hover{transform:translateY(-8px);box-shadow:0 26px 50px -20px rgba(0,0,0,.8);border-color:rgba(216,180,90,.3)}
.cat .emoji{font-size:1.9rem} .cat .name{margin-top:8px;font-weight:800;font-size:.9rem}

.interview{display:grid;grid-template-columns:250px 1fr;gap:20px}
.side{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--stroke);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;height:fit-content;position:sticky;top:90px}
.bot{position:relative;width:100%;aspect-ratio:1/1.1;border-radius:18px;overflow:hidden;border:1px solid var(--stroke);background:radial-gradient(circle at 50% 20%,rgba(127,215,224,.18),transparent 60%)}
.bot img{width:100%;height:100%;object-fit:cover;animation:float2 5s ease-in-out infinite}
.bot-fallback{display:grid;place-items:center;font-size:3.2rem;height:100%}
.ring-wrap{display:flex;align-items:center;gap:12px}
.ring{--p:0;position:relative;width:60px;height:60px;border-radius:50%;flex:0 0 auto;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center}
.ring::before{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:#0d0f16}
.ring b{position:relative;font-size:.8rem;font-weight:900}
.speech{background:linear-gradient(90deg,var(--gold),var(--gold-2));color:#0a0a0a;padding:11px 13px;border-radius:14px;font-weight:700;font-size:.85rem}
.speech .who{font-weight:900;font-size:.8rem;margin-bottom:2px}
.qpanel{min-height:340px;display:flex;flex-direction:column}
.qnum{color:var(--gold-2);font-weight:900;font-size:.84rem}
.qtext{font-weight:900;font-size:1.28rem;margin-top:6px;line-height:1.5}
.qhint{color:var(--muted);font-size:.85rem;margin-top:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:11px;margin-top:18px}
.opt{padding:13px 15px;border-radius:14px;cursor:pointer;border:1px solid var(--stroke);background:linear-gradient(165deg,rgba(255,255,255,.05),rgba(255,255,255,.015));font-weight:700;font-size:.9rem;transition:transform .14s,border-color .2s,box-shadow .2s;display:flex;align-items:center;gap:10px}
.opt:hover{transform:translateY(-3px);border-color:rgba(216,180,90,.4)}
.opt .tick{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--stroke-2);flex:0 0 auto;display:grid;place-items:center;font-size:.7rem;color:transparent}
.opt.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)} .opt.selected .tick{background:var(--gold);border-color:var(--gold);color:#0a0a0a}
.freeinput{width:100%;margin-top:16px;padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--stroke);color:var(--text);font-size:.95rem;min-height:56px;resize:vertical;line-height:1.7}
.freeinput:focus{outline:none;border-color:var(--gold)}
.multi-note{color:var(--muted);font-size:.76rem;margin-top:10px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:auto;padding-top:22px}

.prompt-box{background:#07080d;border:1px solid var(--stroke);border-radius:18px;padding:18px}
.prompt-box pre{white-space:pre-wrap;word-break:break-word;font-family:'Vazirmatn',ui-monospace,monospace;font-size:.92rem;line-height:1.85;color:#e8ecf5;max-height:48vh;overflow:auto}
.prompt-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.tag{display:inline-block;padding:5px 11px;border-radius:999px;background:rgba(216,180,90,.12);color:var(--gold-2);font-size:.74rem;font-weight:700;border:1px solid rgba(216,180,90,.25);margin-inline-end:6px}
.field{margin-top:14px;max-width:360px}
.field label{font-size:.84rem;color:var(--muted);font-weight:700}
.field select,.field input{width:100%;margin-top:6px;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--stroke);color:var(--text);font-size:.92rem}

/* modal */
.modal{position:fixed;inset:0;z-index:200;display:none;place-items:center;background:rgba(3,4,8,.72);backdrop-filter:blur(6px);padding:18px}
.modal.open{display:grid}
.panel{width:560px;max-width:100%;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#0e121c,#0a0c13);border:1px solid var(--stroke-2);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.panel h3{font-size:1.15rem;font-weight:900}
.wallet{margin-top:12px;border:1px solid var(--stroke);border-radius:14px;padding:12px;background:rgba(255,255,255,.02)}
.wallet .c{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wallet .addr{font-family:ui-monospace,monospace;font-size:.78rem;word-break:break-all;color:#cdd3e0}
.wallet .net{font-weight:800;color:var(--gold-2);font-size:.85rem}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#12151f;border:1px solid var(--stroke-2);color:var(--text);padding:12px 20px;border-radius:14px;font-weight:700;z-index:300;opacity:0;transition:.3s;box-shadow:var(--shadow);max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)} .toast.ok{border-color:rgba(90,209,160,.5)} .toast.err{border-color:rgba(240,106,106,.5)}
.spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:40px}
.hidden{display:none!important}
@media (max-width:900px){ .interview{grid-template-columns:1fr} .side{flex-direction:row;position:static;flex-wrap:wrap;align-items:center} .bot{width:110px} }
[dir="rtl"] .tag{margin-inline-end:6px}
</style>
</head>

 'کاردستی و خلاقیت':{en:'Crafts & Creativity',ar:'الحرف والإبداع',tr:'El Sanatları',fr:'Loisirs Créatifs',de:'Basteln & Kreativität',es:'Manualidades',zh:'手工与创意'},
 'ایده‌پردازی':{en:'Ideation',ar:'توليد الأفكار',tr:'Fikir Üretme',fr:'Idéation',de:'Ideenfindung',es:'Ideación',zh:'创意构思'},
 'سرگرمی':{en:'Entertainment',ar:'الترفيه',tr:'Eğlence',fr:'Divertissement',de:'Unterhaltung',es:'Entretenimiento',zh:'娱乐'},

 'موضوع دلخواه (عمومی)':{en:'Custom Topic (General)',ar:'موضوع مخصص (عام)',tr:'Özel Konu (Genel)',fr:'Sujet Libre (Général)',de:'Eigenes Thema',es:'Tema Libre (General)',zh:'自定义主题（通用）'},
};
function catLabel(fa){ if(LANG==='fa') return fa; const m=CAT_I18N[fa]; return (m && (m[LANG]||m.en)) || fa; }

/* ---------------- state / helpers ---------------- */
const el = id => document.getElementById(id);
const getCode = () => localStorage.getItem('epai_code') || '';
const setCode = c => c ? localStorage.setItem('epai_code', c) : localStorage.removeItem('epai_code');
let IS_PRO = false;
let state = { cat:null, answers:{}, cache:{}, order:[], q:null, total:20 };

let toastT;
function toast(m,type=''){ const e=el('toast'); e.textContent=m; e.className='toast show '+type; clearTimeout(toastT); toastT=setTimeout(()=>e.className='toast',2800); }

async function api(path, body){
  const opt = { method: body?'POST':'GET', headers:{} };
  if(body){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  const code = getCode(); if(code) opt.headers['Authorization']='Bearer '+code;
  const r = await fetch(API_BASE+path, opt);
  return r.json();
}

/* ---------------- language / apply text ---------------- */
function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = RTL.has(LANG) ? 'rtl' : 'ltr';
  el('introDesc').innerHTML = t('desc');
  el('introLangLabel').textContent = t('chooseLang');
  el('introGo').textContent = t('getStarted');
  el('brandSub').textContent = t('brandSub');
  el('planText').textContent = IS_PRO ? t('pro') : t('free');
  el('btnUpgrade').textContent = t('upgrade');
  el('btnCode').textContent = t('enterCode');
  el('btnHome').textContent = t('home');
  el('homeTitle').innerHTML = t('homeTitle');
  el('homeSub').textContent = t('homeSub');
  el('chooseTopic').textContent = t('chooseTopic');
  el('catSearch').placeholder = t('searchPh');
  el('resReady').textContent = t('resReady');
  el('resSub').textContent = t('resSub');
  el('outLangLabel').textContent = t('outLang');
  el('btnCopy').textContent = t('copy');
  el('btnDownload').textContent = t('download');
  el('btnRunAI').textContent = t('runAI');
  el('btnRestart').textContent = t('newPrompt');
  el('aiTitle').textContent = t('aiTitle');
  el('footContact').textContent = t('contact');
  el('codeTitle').textContent = t('codeTitle');
  el('codeLbl').textContent = t('codeLbl');
  el('codeSubmit').textContent = t('activate');
  el('payTitle').textContent = t('payTitle');
  el('paySub').textContent = t('paySub');
  el('ringCap').textContent = t('progressCap');
  document.querySelectorAll('[data-close]').forEach(b=>b.textContent=t('cancel'));
  el('btnPrev').textContent = t('prev');
  if(state.q) el('btnNext').textContent = (state.order.length>=state.total) ? t('build') : t('next');
}

/* ---------------- categories / home ---------------- */
let CATS = [];
async function loadCats(){
  try{ const d = await api('/api/categories'); CATS = d.categories||[]; renderCats(''); }
  catch(e){ el('cats').innerHTML = '<div style="color:var(--muted);padding:20px">'+t('error')+'</div>'; }
}
function renderCats(filter){
  const box = el('cats'); box.innerHTML='';
  const f=(filter||'').trim().toLowerCase();
  CATS.filter(c=>!f || c.n.includes(filter) || catLabel(c.n).toLowerCase().includes(f)).forEach(c=>{
    const d=document.createElement('div'); d.className='cat';
    d.innerHTML=`<div class="emoji">${c.e}</div><div class="name">${catLabel(c.n)}</div>`;
    d.onclick=()=>startInterview(c);
    box.appendChild(d);
  });
  if(!box.children.length) box.innerHTML='<div style="color:var(--muted);padding:20px">—</div>';
}

/* ---------------- interview (server-driven) ---------------- */
function show(view){ ['viewHome','viewInterview','viewResult'].forEach(v=>el(v).classList.toggle('hidden', v!==view)); window.scrollTo({top:0,behavior:'smooth'}); }

async function startInterview(cat){
  state = { cat:cat.n, catEmoji:cat.e, catLabel:catLabel(cat.n), answers:{}, cache:{}, order:[], q:null, total: IS_PRO?30:20 };
  el('sideCat').innerHTML = cat.e+' <b style="color:var(--text)">'+state.catLabel+'</b>';
  show('viewInterview');
  el('qText').innerHTML = '<div class="spin"></div>'; el('opts').innerHTML=''; el('freeInput').classList.add('hidden');
  await fetchNext();
}

async function fetchNext(){
  const d = await api('/api/next', { category: state.cat, answers: state.answers, lang: LANG });
  IS_PRO = !!d.pro; state.total = d.total || state.total; refreshPlan();
  if(d.done){ return finish(); }
  state.q = d.question;
  if(!state.order.includes(d.question.id)) state.order.push(d.question.id);
  renderQuestion(d.index, d.total);
}

const SPEECH = ()=>({en:["Great — keep going!","The more detail, the better the prompt.","Nice, that helps a lot.","Almost there!"],
  fa:["عالیه، ادامه بده!","هرچه دقیق‌تر، پرامپت بهتر.","خوبه، خیلی کمک کرد.","نزدیکیم!"]}[LANG] || ["Great — keep going!","Nice!","Almost there!"]);

function renderQuestion(index, total){
  const q = state.q;
  el('qNum').textContent = t('qOf').replace('{n}', index).replace('{t}', total);
  el('qText').textContent = q.text;
  el('qHint').textContent = q.hint||''; el('qHint').style.display = q.hint?'block':'none';
  const opts = el('opts'), free = el('freeInput'), multiNote = el('multiNote');
  const cur = state.cache[q.id];
  if(q.type==='text'){
    opts.classList.add('hidden'); multiNote.classList.add('hidden'); free.classList.remove('hidden');
    free.placeholder = t('typeHere'); free.value = cur||''; setTimeout(()=>free.focus(),40);
  } else {
    free.classList.add('hidden'); opts.classList.remove('hidden'); opts.innerHTML='';
    multiNote.classList.toggle('hidden', q.type!=='multi'); multiNote.textContent=t('multi');
    (q.options||[]).forEach(opt=>{
      const val = (opt && typeof opt==='object') ? opt.v : opt;   // fa value (sent to server)
      const label = (opt && typeof opt==='object') ? opt.l : opt; // localized display
      const d=document.createElement('div'); d.className='opt';
      const sel = q.type==='multi' ? (Array.isArray(cur)&&cur.includes(val)) : cur===val;
      if(sel) d.classList.add('selected');
      d.innerHTML=`<span class="tick">✔</span><span>${label}</span>`;
      d.onclick=()=>{
        if(q.type==='multi'){ let a=Array.isArray(state.cache[q.id])?[...state.cache[q.id]]:[]; a.includes(val)?a=a.filter(x=>x!==val):a.push(val); state.cache[q.id]=a; d.classList.toggle('selected'); }
        else { state.cache[q.id]=val; [...opts.children].forEach(c=>c.classList.remove('selected')); d.classList.add('selected'); }
      };
      opts.appendChild(d);
    });
  }
  const done = state.order.indexOf(q.id);
  const pct = Math.round((done/total)*100);
  el('ring').style.setProperty('--p',pct); el('ringNum').textContent=index; el('ringLabel').textContent=index+' / '+total;
  el('btnPrev').disabled = state.order.indexOf(q.id)===0;
  el('btnNext').textContent = index>=total ? t('build') : t('next');
  el('speech').textContent = SPEECH()[Math.floor(Math.random()*SPEECH().length)];
  el('qText').animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:260});
}

function commitAnswer(){
  const q=state.q; if(!q) return;
  if(q.type==='text') state.cache[q.id]=el('freeInput').value.trim();
  const v=state.cache[q.id];
  if(v!==undefined && v!=='' && !(Array.isArray(v)&&!v.length)) state.answers[q.id]=v;
  else delete state.answers[q.id];
}

el('btnNext').onclick=async()=>{ commitAnswer(); el('qText').innerHTML='<div class="spin"></div>'; el('opts').innerHTML=''; el('freeInput').classList.add('hidden'); await fetchNext(); };
el('btnPrev').onclick=async()=>{
  commitAnswer();
  const pos=state.order.indexOf(state.q.id);
  if(pos>0){ const prevId=state.order[pos-1]; delete state.answers[prevId]; el('qText').innerHTML='<div class="spin"></div>'; await fetchNext(); }
};

/* ---------------- result ---------------- */
async function finish(){
  show('viewResult');
  const sel=el('langSel');
  if(!sel.children.length){ OUT_LANGS.forEach(([c,n])=>{ const o=document.createElement('option'); o.value=c; o.textContent=n; sel.appendChild(o); }); sel.value=LANG; }
  el('aiOut').classList.add('hidden');
  await renderResult();
}
async function renderResult(){
  el('promptOut').textContent = t('loading');
  const d = await api('/api/generate', { category: state.cat, answers: state.answers, lang: el('langSel').value });
  IS_PRO=!!d.pro; refreshPlan();
  el('promptOut').textContent = d.prompt||t('error');
  const on = (OUT_LANGS.find(l=>l[0]===el('langSel').value)||[])[1]||'';
  el('promptTags').innerHTML = `<span class="tag">${state.catEmoji} ${state.catLabel||state.cat}</span><span class="tag">${on}</span>`+(IS_PRO?'<span class="tag">★ Pro</span>':'');
}
el('langSel').onchange=renderResult;
el('btnCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(el('promptOut').textContent); toast(t('copied'),'ok'); }catch(e){ toast(t('copied'),'ok'); } };
el('btnDownload').onclick=()=>{ const b=new Blob([el('promptOut').textContent],{type:'text/markdown'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='easy-prompt-ai.md'; a.click(); URL.revokeObjectURL(u); };
el('btnRestart').onclick=()=>show('viewHome');
el('btnRunAI').onclick=async()=>{
  if(!IS_PRO){ toast(t('aiPro'),'err'); return; }
  el('aiOut').classList.remove('hidden'); el('aiText').textContent=t('loading');
  const d = await api('/api/ai/run', { prompt: el('promptOut').textContent });
  el('aiText').textContent = d.ok ? d.text : (d.error==='ai_not_configured'? t('aiSoon') : (d.error||t('error')));
};

/* ---------------- plan / code / pay ---------------- */
function refreshPlan(){ const b=el('planBadge'); b.className='badge '+(IS_PRO?'pro':'free'); el('planText').textContent=IS_PRO?t('pro'):t('free'); }
async function checkMe(){ try{ const d=await api('/api/me'); IS_PRO=!!d.pro; refreshPlan(); }catch(e){} }

function openModal(id){ el(id).classList.add('open'); }
function closeModals(){ document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open')); }
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModals);
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('mousedown',e=>{ if(e.target===m) closeModals(); }));

el('btnCode').onclick=()=>{ el('codeInput').value=''; openModal('codeModal'); setTimeout(()=>el('codeInput').focus(),50); };
el('codeSubmit').onclick=async()=>{
  const c=el('codeInput').value.trim(); if(!c) return;
  setCode(c); const d=await api('/api/me');
  if(d.pro){ IS_PRO=true; refreshPlan(); closeModals(); toast(t('activated'),'ok'); }
  else { setCode(''); toast(t('invalid'),'err'); }
};
el('btnHome').onclick=()=>show('viewHome');

el('btnUpgrade').onclick=async()=>{ openModal('payModal'); await renderPay(); };
async function renderPay(){
  const body=el('payBody'); body.innerHTML='<div class="spin"></div>';
  let cfg; try{ cfg=await api('/api/pay/config'); }catch(e){ body.innerHTML=t('error'); return; }
  const price=cfg.price_usdt||'9';
  const nets=[['trc20','USDT · TRC-20 (Tron)'],['erc20','USDT · ERC-20 (Ethereum)'],['bep20','USDT · BEP-20 (BNB)'],['arbitrum','USDT · Arbitrum']];
  let html = `<div style="margin-top:10px;font-weight:800">${t('price')}: <span style="color:var(--gold-2)">${price} USDT</span></div>`;
  html += `<div class="field" style="max-width:100%"><label>${t('payChain')}</label><select id="payChain">`;
  nets.forEach(([k,label])=>{ if(cfg.wallets && cfg.wallets[k]) html+=`<option value="${k}">${label}</option>`; });
  html += `</select></div><div id="walletWrap"></div>`;
  html += `<div class="field" style="max-width:100%"><label>TxID</label><input id="txid" placeholder="${t('txidPh')}"></div>`;
  html += `<button class="btn primary" id="verifyBtn" style="margin-top:12px;width:100%">${t('verify')}</button>`;
  html += `<div style="text-align:center;color:var(--muted);font-size:.8rem;margin-top:14px">— ${t('paypalSoon')} —</div>`;
  body.innerHTML=html;
  const wallets=cfg.wallets||{};
  function showWallet(){ const k=el('payChain').value; const addr=wallets[k]||''; el('walletWrap').innerHTML=
    `<div class="wallet"><div class="net">${(nets.find(n=>n[0]===k)||[])[1]||k}</div><div class="c"><div class="addr">${addr}</div><button class="btn sm" id="copyAddr">${t('copyAddr')}</button></div></div>`;
    el('copyAddr').onclick=()=>{ navigator.clipboard?.writeText(addr); toast(t('copied'),'ok'); };
  }
  el('payChain').onchange=showWallet; showWallet();
  el('verifyBtn').onclick=async()=>{
    const chain=el('payChain').value, txid=el('txid').value.trim(); if(!txid) return;
    el('verifyBtn').disabled=true; el('verifyBtn').textContent=t('verifying');
    const d=await api('/api/pay/usdt/verify',{chain,txid});
    if(d.ok && d.code){ setCode(d.code); IS_PRO=true; refreshPlan(); closeModals(); toast(t('activated'),'ok'); }
    else { toast(t('payFail'),'err'); el('verifyBtn').disabled=false; el('verifyBtn').textContent=t('verify'); }
  };
}

/* ---------------- language selectors ---------------- */
function fillLangSelects(){
  [el('introLang'), el('uiLang')].forEach(s=>{ s.innerHTML=''; LANGS.forEach(([c,n])=>{ const o=document.createElement('option'); o.value=c; o.textContent=n; s.appendChild(o); }); s.value=LANG; });
}
el('introLang').onchange=e=>{ LANG=e.target.value; applyLang(); };
el('uiLang').onchange=e=>{ LANG=e.target.value; localStorage.setItem('epai_ui_lang',LANG); el('introLang').value=LANG; applyLang(); renderCats(el('catSearch').value);
  if(state.cat){ state.catLabel=catLabel(state.cat); el('sideCat').innerHTML = state.catEmoji+' <b style="color:var(--text)">'+state.catLabel+'</b>'; }
  // if mid-interview, re-fetch the current question translated to the new language
  const inInterview = !el('viewInterview').classList.contains('hidden');
  if(state.q && inInterview){
    if(state.q.type==='text') state.cache[state.q.id]=el('freeInput').value; // keep uncommitted text
    el('qText').innerHTML='<div class="spin"></div>'; el('opts').innerHTML=''; el('freeInput').classList.add('hidden');
    fetchNext();
  }
};
el('catSearch').oninput=e=>renderCats(e.target.value);

el('introGo').onclick=()=>{ localStorage.setItem('epai_ui_lang',LANG); el('intro').classList.add('hidden'); el('app').classList.remove('hidden'); };

/* ---------------- init ---------------- */
(async function init(){
  fillLangSelects();
  applyLang();
  await checkMe();
  applyLang();
  loadCats();
})();
</script>
