name: Build Zoom Live Subtitles (Windows)

on:
  push:
    branches: [main, "claude/zoom-persian-translation-subtitles-4x3l7g"]
    paths:
      - "zoom-translator/**"
      - ".github/workflows/build-zoom-translator.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zoom-translator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoomLiveSubtitles-Windows-Setup
          path: zoom-translator/dist/*.exe
          if-no-files-found: error

      - name: Attach installer to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: zoom-translator/dist/*.exe
