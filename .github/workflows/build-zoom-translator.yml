name: Build Zoom Live Subtitles (Windows)

on:
  push:
    branches: [main, "claude/zoom-persian-translation-subtitles-4x3l7g", "claude/zoom-persian-subtitles-translation-k08eqj"]
    paths:
      - "zoom-translator/**"
      - ".github/workflows/build-zoom-translator.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: zoom-translator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZoomLiveSubtitles-Windows-Setup
          path: zoom-translator/dist/*.exe
          if-no-files-found: error

      - name: Attach installer to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: zoom-translator/dist/*.exe

      # Publish/update a rolling "dev-<branch>" prerelease with the latest installer
      # so it's downloadable from a github.com URL (Actions artifacts live on Azure
      # Blob storage which isn't universally reachable).
      - name: Publish rolling dev release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.ref_name }}
          name: "Zoom Live Subtitles — dev build (${{ github.ref_name }})"
          body: |
            Auto-built from `${{ github.ref_name }}` @ `${{ github.sha }}`.
            Not a stable release — updated on every push to this branch.
          prerelease: true
          fail_on_unmatched_files: true
          files: zoom-translator/dist/*.exe
