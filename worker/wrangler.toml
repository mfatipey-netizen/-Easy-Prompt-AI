name = "easy-prompt-ai"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Public, non-secret configuration (safe to commit).
[vars]
ALLOWED_ORIGIN = "https://easypromptai.net,https://www.easypromptai.net,https://mfatipey-netizen.github.io"
PAYPAL_ENV = "live"           # real payments (use a Live PayPal app)
PRICE_USDT = "9"
AI_MODEL = "claude-haiku-4-5-20251001"
# Receiving USDT/USDC wallets (public addresses — customers pay to these).
USDT_TRC20_ADDRESS = "TKapHqn3SfLMcNeKcnF85tWknza2y3tL8V"          # TRON (TRC-20)
USDT_ERC20_ADDRESS = "0x1D7890d49cc240ee6E4c3E7EE4FC4bB7dFdF30DA"  # Ethereum (ERC-20)
USDT_BEP20_ADDRESS = "0x1D7890d49cc240ee6E4c3E7EE4FC4bB7dFdF30DA"  # BNB Chain (BEP-20)
USDT_ARB_ADDRESS   = "0x1D7890d49cc240ee6E4c3E7EE4FC4bB7dFdF30DA"  # Arbitrum

# D1 database binding. Create it with:  npx wrangler d1 create easy-prompt-ai
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "easy-prompt-ai"
database_id = "01f95c78-b269-4357-807e-7413adfd8c6d"

# Secrets are NOT stored here. Set them with `npx wrangler secret put NAME`:
#   ADMIN_TOKEN          admin auth for /api/admin/gen
#   ANTHROPIC_API_KEY    live AI (Claude)
#   PAYPAL_CLIENT_ID     PayPal REST app client id
#   PAYPAL_SECRET        PayPal REST app secret
#   ETHERSCAN_KEY        (optional) for ERC-20 verification
