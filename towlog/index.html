<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>TowLog Runsheet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--tx:#f1f5f9;--mut:#94a3b8;--acc:#f59e0b;--ok:#22c55e;--bad:#ef4444;--blue:#3b82f6;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:170px}
header{position:sticky;top:0;z-index:5;background:#111827;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1}
header .gps{font-size:13px;color:var(--mut)}
#langBtn{background:#1f2937;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:700}
main{padding:12px 16px;max-width:900px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111827;border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0;font-size:12px;font-family:inherit;min-width:0}
nav button b{display:block;font-size:22px}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid>*{min-width:0}
.full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.f{position:relative}
input,select,textarea{width:100%;min-width:0;max-width:100%;background:#0b1220;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:16px;font-family:inherit}
/* mic buttons sit on the page's end side; pad that physical side whatever the text direction is */
[dir=ltr] .f input,[dir=ltr] .f textarea{padding-right:42px;padding-left:10px}
[dir=rtl] .f input,[dir=rtl] .f textarea{padding-left:42px;padding-right:10px}
[dir=ltr] .f.loc input{padding-right:86px}[dir=rtl] .f.loc input{padding-left:86px}
.ltr{direction:ltr;text-align:left}
[dir=rtl] .ltr{text-align:right}
textarea{min-height:60px;resize:vertical}
.mic{position:absolute;inset-inline-end:4px;bottom:4px;width:36px;height:36px;border:0;border-radius:8px;background:#1f2937;color:var(--tx);font-size:17px}
.mic.gps2{inset-inline-end:44px}
.mic.rec{background:var(--bad);animation:p 1s infinite}
@keyframes p{50%{opacity:.5}}
.btn{border:0;border-radius:12px;padding:13px 14px;font-size:16px;font-weight:600;background:#334155;color:var(--tx);font-family:inherit}
.btn.acc{background:var(--acc);color:#111}.btn.ok{background:var(--ok);color:#052e12}.btn.bad{background:var(--bad)}.btn.blue{background:var(--blue)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}
.big{font-size:19px;padding:18px}
.acct{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.acct button{padding:10px 4px;border-radius:10px;border:2px solid var(--line);background:#0b1220;color:var(--tx);font-weight:700;font-size:14px;font-family:inherit}
.acct button small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.acct button.on{border-color:var(--acc);background:#3b2a07}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stages .btn{padding:14px 4px;font-size:14px}
.stages .done{background:#14532d}
.price{font-size:14px}
.price table{width:100%;border-collapse:collapse}
.price td{padding:4px 0;border-bottom:1px dashed var(--line)}.price td:last-child{text-align:end;direction:ltr;white-space:nowrap}
.price tr.t td{font-weight:800;font-size:18px;color:var(--acc);border:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs div{position:relative}
.thumbs img{width:96px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;inset-inline-end:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
.c-cash{background:#7f1d1d}.c-basic{background:#78350f}.c-plus{background:#1e3a8a}.c-premium{background:#4c1d95}
.list .it{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it div{flex:1;min-width:0}.list small{color:var(--mut)}
.list .it .btn{padding:10px 12px}
.alarm{position:fixed;inset:0;background:rgba(127,29,29,.97);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.alarm.show{display:flex;animation:fl .6s 4}
@keyframes fl{50%{background:rgba(220,38,38,.97)}}
.alarm h2{font-size:30px;margin:10px 0}.alarm p{font-size:20px;margin:6px 0}
.alarm .amt{font-size:42px;font-weight:900;margin:12px 0;direction:ltr}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:55;display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}.modal .card{width:100%;max-width:520px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;border:1px solid var(--acc);padding:10px 16px;border-radius:10px;z-index:60;display:none;max-width:90%}
.banner{background:#3b2a07;border:1px solid var(--acc);border-radius:12px;padding:12px;margin-bottom:12px}
.disp{border-color:var(--blue)}.disp h2{color:#93c5fd}
.tbl{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
.tbl table{border-collapse:collapse;font-size:12px;white-space:nowrap;min-width:100%}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start}
.tbl th{background:#111827;color:var(--acc);position:sticky;top:0}
.tbl tfoot td{font-weight:800;background:#111827}
.tbl tbody tr:nth-child(even) td{background:#22304a}
.tbl tbody tr.sel td{background:#3b2a07;color:#fde68a}
.tbl td.num{text-align:end;direction:ltr}
.list .it:nth-child(even){background:#1b2740;margin:0 -8px;padding-inline:8px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.sum div{background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:10px}.sum b{display:block;font-size:20px;color:var(--acc);direction:ltr;text-align:start}
.voicebar{position:fixed;inset-inline-end:16px;bottom:96px;z-index:7;width:66px;height:66px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:30px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.voicebar.rec{background:var(--bad);animation:p 1s infinite}
.hint{font-size:12px;color:var(--mut)}
.guide h3{font-size:15px;margin:16px 0 6px;color:var(--tx)}.guide ol,.guide ul{margin:0;padding-inline-start:22px}.guide li{margin:4px 0}
.guide .tip{background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;font-size:14px}
.ac{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;position:absolute;left:0;right:0;top:100%;z-index:20;background:#0b1220;border:1px solid var(--acc);border-radius:10px;margin-top:2px;max-height:260px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.ac button{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);color:var(--tx);padding:12px;font-size:16px;font-family:inherit}
.ac button:last-child{border-bottom:0}.ac button b{color:var(--acc)}.ac button small{color:var(--mut);margin-inline-start:6px}
.ocrbox{margin-top:10px;background:#0b1220;border:2px solid var(--acc);border-radius:12px;padding:12px}
.ocrbox label{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--tx);margin:6px 0}.ocrbox input[type=checkbox]{width:auto;transform:scale(1.4)}
.ocrbox input.v{flex:1}
.shift{border-color:var(--ok)}
.price table.split{margin-top:10px;font-size:13px}.split th{text-align:end;color:var(--mut);font-weight:600;padding:4px 0;direction:ltr}.split th:first-child{text-align:start}
.split td{text-align:end;direction:ltr;white-space:nowrap;padding:5px 0 5px 6px}.split td:first-child{text-align:start;direction:inherit;white-space:normal}
.split tr.me td{color:var(--ok);font-weight:800}.split tr.tot td{font-weight:800;border-top:2px solid var(--line);border-bottom:0}
#todaySum{grid-template-columns:repeat(2,1fr)}#todaySum b{font-size:17px}
.stars{display:flex;gap:4px}.stars button{background:none;border:0;font-size:28px;padding:0 2px;color:#475569}.stars button.on{color:var(--acc)}
.hide{display:none!important}
@media print{
 header,nav,.voicebar,.noprint,#v-call,#v-log,#v-set{display:none!important}
 body{background:#fff;color:#000;padding:0}.card{border:0;background:#fff;padding:0}
 .tbl{overflow:visible;border:0}.tbl th,.tbl td{border:1px solid #999;color:#000;background:#fff;font-size:9px;padding:3px}
 .sum div{border:1px solid #999;background:#fff}.sum b{color:#000}
 #v-rep{display:block!important}
}
</style>
</head>
<body>
<header>
  <h1>🚛 TowLog</h1>
  <span class="gps" id="gpsStat"></span>
  <button id="langBtn">EN</button>
</header>

<main>
<!-- ================= CALL ================= -->
<section id="v-home">
  <div id="reportBanner" class="banner hide"></div>
  <div class="row" style="margin-bottom:12px;flex-direction:column">
    <button class="btn acc big" id="resumeBtn" style="font-size:20px;padding:20px"></button>
    <button class="btn ok big" id="homeNew" data-i="newCall" style="font-size:22px;padding:22px"></button>
  </div>
  <div class="card">
    <h2 data-i="todayT"></h2>
    <div class="sum" id="todaySum"></div>
    <div class="list" id="todayList"></div>
  </div>
  <div class="card shift">
    <div class="row">
      <button class="btn big" id="shiftStart" data-i="shiftStart"></button>
      <button class="btn bad big" id="shiftEnd" data-i="shiftEnd"></button>
    </div>
    <p class="hint" id="shiftStat"></p>
  </div>
</section>

<section id="v-call" class="hide">
  <button class="btn" id="backHome" data-i="backHome" style="margin-bottom:10px"></button>

  <div class="card disp">
    <h2 data-i="dispT"></h2>
    <div class="row">
      <button class="btn blue" id="dispShotBtn" data-i="dispShot"></button>
      <button class="btn" id="dispPasteBtn" data-i="dispPaste"></button>
    </div>
    <input type="file" id="dispShotIn" accept="image/*" class="hide">
    <p class="hint" id="dispMsg" data-i="dispHint"></p>
  </div>

  <div class="card">
    <h2 data-i="acctType"></h2>
    <div class="acct" id="acct"></div>
    <div id="cashBox" class="hide" style="margin-top:10px">
      <div class="row" style="align-items:center">
        <label style="flex:1;margin:0;font-size:15px;color:var(--tx)"><input type="checkbox" id="cashOk" style="width:auto;transform:scale(1.5);margin-inline-end:10px"><span data-i="cashCollected"></span></label>
        <div style="width:130px"><input id="f_collected" class="ltr" inputmode="decimal" data-ip="collectedPh"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 data-i="progress"></h2>
    <div class="stages">
      <button class="btn" id="st0"></button><button class="btn" id="st1"></button>
      <button class="btn" id="st2"></button><button class="btn" id="st3"></button>
    </div>
    <p class="hint" data-i="stageHint"></p>
    <div class="grid">
      <div class="f"><label data-i="timeStart"></label><input type="time" id="f_timeStart" class="ltr"></div>
      <div class="f"><label data-i="timeEnd"></label><input type="time" id="f_timeEnd" class="ltr"></div>
      <div class="f"><label data-i="kmTo"></label><input id="f_kmTo" class="ltr" inputmode="decimal"></div>
      <div class="f"><label data-i="kmTow"></label><input id="f_kmTow" class="ltr" inputmode="decimal"></div>
      <div class="f"><label>REM</label><input id="f_rem" class="ltr" inputmode="decimal"><button class="mic" data-k="rem" type="button">🎤</button></div>
      <div class="f"><label>RPM</label><input id="f_rpm" class="ltr" inputmode="decimal"><button class="mic" data-k="rpm" type="button">🎤</button></div>
    </div>
  </div>

  <div class="card">
    <h2 data-i="reasonT"></h2>
    <select id="f_reason"></select>
    <div class="f" style="margin-top:8px"><label data-i="notes"></label><textarea id="f_notes" dir="auto"></textarea><button class="mic" data-k="notes" type="button">🎤</button></div>
  </div>

  <div class="card">
    <h2 data-i="photoT"></h2>
    <div class="row">
      <button class="btn acc" id="photoBtn" data-i="takePhoto"></button>
      <button class="btn" id="ocrBtn" data-i="readPV"></button>
      <button class="btn" id="vinScanBtn" data-i="scanVin"></button>
    </div>
    <input type="file" id="photoIn" accept="image/*" capture="environment" class="hide">
    <input type="file" id="vinIn" accept="image/*" capture="environment" class="hide">
    <div class="thumbs" id="thumbs"></div>
    <p class="hint" id="ocrMsg"></p>
    <div id="ocrBox" class="ocrbox hide"></div>
  </div>

  <div class="card"><h2 data-i="vehT"></h2><div class="grid" id="vehGrid"></div></div>
  <div class="card"><h2 data-i="jobT"></h2><div class="grid" id="jobGrid"></div></div>
  <div class="card price" id="priceBox"></div>

  <div class="row noprint">
    <button class="btn" id="newBtn" data-i="newCall"></button>
    <button class="btn ok big" id="saveBtn" data-i="saveCall"></button>
  </div>
</section>

<!-- ================= LOG ================= -->
<section id="v-log" class="hide">
  <div class="card">
    <h2 data-i="logT"></h2>
    <input id="search" dir="auto" data-ip="searchPh">
    <div class="list" id="list"></div>
  </div>
</section>

<!-- ================= REPORT ================= -->
<section id="v-rep" class="hide">
  <div class="card">
    <h2 data-i="repT"></h2>
    <div class="row noprint">
      <select id="period" style="flex:2;direction:ltr"></select>
      <button class="btn" id="csvBtn" data-i="csv"></button>
      <button class="btn" id="printBtn" data-i="print"></button>
    </div>
    <div id="repHead"></div>
    <div class="sum" id="repSum"></div>
    <h2 data-i="dailyT" style="margin-top:14px"></h2>
    <div class="tbl" id="repDaily"></div>
    <h2 data-i="callsT" style="margin-top:14px"></h2>
    <div class="tbl" id="repTbl"></div>
  </div>
</section>

<!-- ================= HELP + FEEDBACK ================= -->
<section id="v-help" class="hide">
  <div class="card guide" id="guide"></div>
  <div class="card">
    <h2 data-i="fbT"></h2>
    <p class="hint" data-i="fbHint"></p>
    <form id="fbForm" class="grid">
      <div><label data-i="fbName"></label><input id="fb_name" dir="auto" autocomplete="name"></div>
      <div><label data-i="fbEmail"></label><input id="fb_email" type="email" class="ltr" autocomplete="email"></div>
      <div><label data-i="fbType"></label><select id="fb_type"></select></div>
      <div><label data-i="fbRate"></label><div class="stars" id="fb_stars"></div></div>
      <div class="full"><label data-i="fbMsg"></label><textarea id="fb_msg" dir="auto" required style="min-height:120px"></textarea></div>
      <div class="full row"><button class="btn acc big" type="submit" id="fbSend" data-i="fbSend"></button></div>
      <p class="hint full" id="fbStatus"></p>
    </form>
  </div>
</section>

<!-- ================= SETTINGS ================= -->
<section id="v-set" class="hide">
  <div class="card">
    <h2 data-i="langT"></h2>
    <div class="grid">
      <div><label data-i="uiLang"></label><select id="s_ui"><option value="fa">فارسی</option><option value="en">English</option></select></div>
      <div><label data-i="dictLang"></label><select id="s_lang"><option value="fa-IR">فارسی</option><option value="en-CA">English (Canada)</option><option value="en-US">English (US)</option></select></div>
      <div><label data-i="speakAlerts"></label><select id="s_speak"><option value="1">On / روشن</option><option value="0">Off / خاموش</option></select></div>
    </div>
    <p class="hint" data-i="voiceHint"></p>
  </div>
  <div class="card"><h2 data-i="setT"></h2><div class="grid" id="setGrid"></div></div>
  <div class="card">
    <h2 data-i="ratesT"></h2>
    <div class="grid" id="rateGrid"></div>
    <p class="hint" data-i="ratesHint"></p>
  </div>
  <div class="card">
    <h2 data-i="mailT"></h2>
    <div class="grid">
      <div class="full"><label data-i="mailAddr"></label><input id="s_email" type="email" class="ltr" autocomplete="email" placeholder="you@gmail.com"></div>
      <div><label data-i="mailCall"></label><select id="s_mailCall"><option value="1">On</option><option value="0">Off</option></select></div>
      <div><label data-i="mailWeek"></label><select id="s_mailWeek"><option value="1">On</option><option value="0">Off</option></select></div>
      <div><label data-i="mailBk"></label><select id="s_mailBk"><option value="1">On</option><option value="0">Off</option></select></div>
      <div style="align-self:end"><button class="btn" id="mailTest" type="button" data-i="mailTest" style="width:100%"></button></div>
    </div>
    <p class="hint" data-i="mailHint"></p>
    <p class="hint" id="mailStat"></p>
  </div>
  <div class="card">
    <h2 data-i="backupT"></h2>
    <p class="hint" data-i="backupHint"></p>
    <div class="row">
      <button class="btn" id="expBtn" data-i="exp"></button>
      <button class="btn" id="impBtn" data-i="imp"></button>
      <input type="file" id="impIn" accept="application/json,.json" class="hide">
    </div>
  </div>
</section>
</main>

<button class="voicebar" id="voiceAll">🎤</button>

<nav>
  <button data-v="home" class="on"><b>🏠</b><span data-i="navCall"></span></button>
  <button data-v="log"><b>📋</b><span data-i="navLog"></span></button>
  <button data-v="rep"><b>📊</b><span data-i="navRep"></span></button>
  <button data-v="set"><b>⚙️</b><span data-i="navSet"></span></button>
  <button data-v="help"><b>❓</b><span data-i="navHelp"></span></button>
</nav>

<div class="alarm" id="alarm">
  <div style="font-size:70px">💵⚠️</div>
  <h2 data-i="alarmH"></h2>
  <p data-i="alarmP"></p>
  <div class="amt" id="alarmAmt"></div>
  <p class="hint" style="color:#fecaca" id="alarmSub"></p>
  <div class="row" style="width:100%;max-width:420px;margin-top:16px">
    <button class="btn ok big" id="alarmPaid" data-i="collectedBtn"></button>
    <button class="btn big" id="alarmLater" data-i="later"></button>
  </div>
</div>

<div class="modal" id="pasteModal">
  <div class="card">
    <h2 data-i="dispPaste"></h2>
    <textarea id="pasteTxt" class="ltr" style="min-height:180px" data-ip="dispPh"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn blue" id="pasteGo" data-i="dispApply"></button>
      <button class="btn" id="pasteClose" data-i="later"></button>
    </div>
  </div>
</div>
<div class="modal" id="voiceModal">
  <div class="card">
    <h2 data-i="vmT"></h2>
    <p class="hint" data-i="vmHint"></p>
    <textarea id="voiceTxt" dir="auto" style="min-height:140px" data-ip="vmPh"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn blue big" id="voiceGo" data-i="dispApply"></button>
      <button class="btn" id="voiceClose" data-i="later"></button>
    </div>
  </div>
</div>
<div class="modal" id="startModal">
  <div class="card">
    <h2 data-i="smT"></h2>
    <p data-i="smHint"></p>
    <div class="row" style="margin-top:10px;flex-direction:column">
      <button class="btn blue big" id="smLoad" data-i="smLoad"></button>
      <button class="btn big" id="smGo" data-i="smGo"></button>
    </div>
  </div>
</div>
<iframe name="mailFrame" id="mailFrame" class="hide" title="mail"></iframe>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

// ---------- i18n ----------
const L={en:{
 dispT:'📲 From dispatch app',dispShot:'📸 Screenshot',dispPaste:'📋 Paste call text',dispHint:'Take a screenshot of the call in the dispatch app (or copy its text) — pickup, destination and km fill in automatically. On Android you can also Share → TowLog.',dispPh:'Paste the call details here…',dispApply:'Fill the form',
 acctType:'Account type',cashCollected:'Cash collected',collectedPh:'$ collected',progress:'Job progress',
 st0:'🚚 En route',st0s:'Time start',st1:'📍 At vehicle',st2:'🔗 Towing',st3:'🏁 Dropped',st3s:'Time ended',
 stageHint:'GPS measures km between steps (keep the app open). Km from the dispatch app or typed by hand always win.',

 guide:`<h2>📖 How to use TowLog</h2>
<h3>1. First time</h3><ol><li>Open the link in Chrome (Android) or Safari (iPhone) → menu → <b>Add to Home Screen</b>.</li><li>Allow <b>microphone, camera and location</b> when asked.</li><li><b>Settings</b>: enter your name, driver/truck numbers and the start date of your 2-week pay period. Check the rates.</li></ol>
<h3>2. When a call comes in</h3><ol><li><b>📸 Screenshot</b> of the call in the dispatch app (or <b>📋 Paste</b> its text, or on Android <b>Share → TowLog</b>) — pickup, destination and km fill in.</li><li>Pick the <b>account type</b>. For <b>Cash</b> calls a red alarm reminds you to <b>collect cash before towing</b>; “Towing” stays locked until you tap <b>Collected</b>.</li><li>Tap the steps as you go: <b>En route → At vehicle → Towing → Dropped</b>. Times are recorded and GPS measures km (keep the app open).</li></ol>
<h3>3. Filling details hands-free</h3><ul><li>Big blue <b>🎤</b>: say several fields at once, e.g. “make Honda, model Civic, colour red, reason flat tire”.</li><li>Small 🎤 next to a field fills just that field. Plate/VIN: spell it (“C X R T 4 5 2”).</li><li><b>iPhone:</b> Apple blocks the app’s own microphone, so the 🎤 opens the keyboard — tap the 🎤 on the keyboard and speak (turn on Settings → General → Keyboard → Enable Dictation).</li><li><b>📷 Take photo</b> of the rear of the vehicle — the app reads the plate, the make/model badges and a VIN, then asks you to confirm. Close, straight-on photos in good light work best. <b>▥ Scan VIN</b> reads the door-jamb barcode (Android).</li></ul>
<h3>4. Pay calculation</h3><ul><li>$52 base for every call.</li><li>Km to vehicle: first 5 km free (all accounts).</li><li>Km towed free: Basic 10, Plus 200, Premium 300, Cash 0.</li><li>Extra km (to vehicle and towed): Plus/Premium $2.50, Basic/Cash $4.50. HST 13% shown separately. All editable in Settings.</li><li>Split (before HST): 10% Classic Towing; of the rest, 35% driver and 65% Golden Gate Towing. Each share shows its HST in the next column.</li></ul>
<h3>5. Save & report</h3><ul><li><b>💾 Save call</b> at the end, then <b>＋ New call</b>.</li><li><b>Report</b> tab: every 2 weeks a table with totals → <b>Excel (CSV)</b> or <b>Print/PDF</b>.</li></ul>
<h3>6. Backup & email</h3><ul><li><b>Settings → Email</b>: enter your email and tap <b>Send test email</b>, then click <b>Activate</b> in the email you get (check Spam). From then on every saved call is emailed to you, and each Monday you get last week’s report as an Excel (CSV) file.</li><li><b>▶ Start</b> (on the Today page): on a new phone or after reinstalling, tap <b>Load database</b> and pick your latest database file.</li><li><b>⏹ Exit & back up</b>: saves the whole database — choose <b>Save to Files → iCloud Drive</b> (or Google Drive) — and emails it to you too.</li></ul>
<div class="tip">🔒 Your data stays only on <b>your</b> phone — nobody else sees it. Use <b>Settings → Export backup</b> regularly (and before changing phones).</div>
<div class="tip">⚠️ Don’t type while driving — use voice, or fill details when parked.</div>`

 guide:`<h2>📖 راهنمای استفاده</h2>
<h3>۱. بار اول</h3><ol><li>لینک را در Chrome (اندروید) یا Safari (آیفون) باز کن ← منو ← <b>Add to Home Screen</b> تا مثل اپ نصب شود.</li><li>وقتی پرسید، اجازهٔ <b>میکروفون، دوربین و موقعیت (GPS)</b> را بده.</li><li>در <b>تنظیمات</b>: نام، شماره راننده و کامیون، و تاریخ شروع دورهٔ دوهفته‌ای را وارد کن و نرخ‌ها را چک کن.</li></ol>
<h3>۲. وقتی کال می‌آید</h3><ol><li>از صفحهٔ کال در اپ دیسپچ <b>📸 اسکرین‌شات</b> بده (یا متنش را <b>📋 بچسبان</b>، یا در اندروید <b>Share ← TowLog</b>)؛ مبدأ، مقصد و کیلومترها خودکار پر می‌شوند.</li><li><b>نوع اکانت</b> را انتخاب کن. برای کال‌های <b>Cash</b> هشدار قرمز می‌آید که <b>قبل از حمل، پول نقد را بگیری</b>؛ تا «دریافت شد» را نزنی، دکمهٔ «شروع حمل» قفل است.</li><li>مراحل را همان‌طور که پیش می‌روی بزن: <b>در راه ← رسیدم ← شروع حمل ← تحویل شد</b>. ساعت‌ها ثبت می‌شود و GPS کیلومتر را می‌شمارد (برنامه باز بماند).</li></ol>
<h3>۳. پر کردن بدون دست</h3><ul><li><b>🎤 آبی بزرگ</b>: چند فیلد را یک‌جا بگو، مثلاً «سازنده تویوتا، مدل کرولا، رنگ سفید، علت پنچری».</li><li>🎤 کوچک کنار هر فیلد فقط همان فیلد را پر می‌کند. پلاک و VIN را حرف‌به‌حرف انگلیسی بگو («C X R T 4 5 2»).</li><li><b>آیفون:</b> اپل میکروفونِ خودِ برنامه را می‌بندد، پس 🎤 کیبورد را باز می‌کند — روی 🎤 کیبورد بزن و بگو (Settings ← General ← Keyboard ← Enable Dictation روشن باشد).</li><li><b>📷 گرفتن عکس</b> از پشت خودرو — برنامه پلاک، نوشتهٔ برند و مدل و VIN را می‌خواند و برای تأیید نشانت می‌دهد. عکس نزدیک، روبه‌رو و در نور خوب بهتر خوانده می‌شود. <b>▥ اسکن VIN</b> بارکد کنار در را می‌خواند (اندروید).</li></ul>
<h3>۴. محاسبهٔ مبلغ</h3><ul><li>۵۲ دلار ثابت برای هر کال.</li><li>مسافت تا خودرو: ۵ کیلومتر اول برای همه رایگان.</li><li>مسافت حمل رایگان: بیسیک ۱۰، پلاس ۲۰۰، پریمیوم ۳۰۰، کش ۰ کیلومتر.</li><li>کیلومتر مازاد (هم تا خودرو هم حمل): پلاس و پریمیوم ۲٫۵ دلار، بیسیک و کش ۴٫۵ دلار. HST ‏۱۳٪ جدا نشان داده می‌شود. همه در تنظیمات قابل تغییرند.</li><li>تقسیم مبلغ (بدون HST): ۱۰٪ Classic Towing؛ از باقیمانده ۳۵٪ سهم راننده و ۶۵٪ Golden Gate Towing. HST هر سهم در ستون بعدی آمده است.</li></ul>
<h3>۵. ذخیره و گزارش</h3><ul><li>آخر کار <b>💾 ذخیرهٔ کال</b>، بعد <b>＋ کال جدید</b>.</li><li>زبانهٔ <b>گزارش</b>: هر دو هفته یک جدول با جمع‌ها ← <b>اکسل (CSV)</b> یا <b>چاپ/PDF</b>.</li></ul>

function rank(list,q,key=x=>x){q=q.trim().toLowerCase();if(!q)return list.slice(0,80);
  const a=[],b=[],c=[];list.forEach(x=>{const s=key(x).toLowerCase();if(s.startsWith(q))a.push(x);else if(s.split(/[\s\-.]+/).some(w=>w.startsWith(q)))b.push(x);else if(s.replace(/[\s\-.]/g,'').includes(q.replace(/[\s\-.]/g,'')))c.push(x)});
  return a.concat(b,c).slice(0,80)}
function suggest(k){
  const el=$('#f_'+k),q=el.value;
  if(k==='make')return rank(MAKES,q).map(m=>({v:m,label:m}));

  if(mk)return rank(CARS[mk],q).map(m=>({v:m,label:m}));

}

function openAC(k){

  // touch: a drag scrolls the list, only a tap picks; touchend is cancelled so no stray click/blur follows
  let sy=null;
  box.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});
  box.addEventListener('touchmove',e=>{if(sy!==null&&Math.abs(e.touches[0].clientY-sy)>8)sy=null},{passive:true});
  box.addEventListener('touchend',e=>{const btn=e.target.closest('button');if(!btn)return;e.preventDefault();if(sy!==null)pick(btn);sy=null});
  // mouse: keep focus in the field, pick on click
  box.addEventListener('mousedown',e=>e.preventDefault());

  el.parentNode.appendChild(box);
}

// ---------- pricing ----------
function price(c){
  const a=c.account||'cash', kmTo=+normDigits(c.kmTo||0)||0, kmTow=+normDigits(c.kmTow||0)||0;
  const rate=(a==='plus'||a==='premium')?+S.rateLow:+S.rateHigh;
  const freeTow=+S['free'+a[0].toUpperCase()+a.slice(1)]||0;
  const exTo=Math.max(0,kmTo-(+S.freeTo)), exTow=Math.max(0,kmTow-freeTow);
  const base=+S.base, toAmt=exTo*rate, towAmt=exTow*rate, net=base+toAmt+towAmt, tx=+S.hst/100, hst=net*tx;
  // split of the amount before HST: Classic Towing first, then driver / Golden Gate Towing share the rest
  const classic=net*(+S.classicPct)/100, rest=net-classic, driver=rest*(+S.driverPct)/100, golden=rest-driver;
  return{a,kmTo,kmTow,rate,freeTow,exTo,exTow,base,toAmt,towAmt,net:r2(net),hst:r2(hst),total:r2(net+hst),
    classic:r2(classic),classicHst:r2(classic*tx),driver:r2(driver),driverHst:r2(driver*tx),golden:r2(golden),goldenHst:r2(golden*tx)};
}
const r2=n=>Math.round(n*100)/100, $f=n=>'$'+(+n||0).toFixed(2);

let watch=null,lastPos=null,legKm=0,wakeLock=null;
function renderStages(){for(let i=0;i<4;i++){const b=$('#st'+i);b.classList.toggle('done',cur.stage>=i);b.classList.toggle('acc',cur.stage===i-1)}}
$$('.stages .btn').forEach((b,i)=>b.onclick=()=>stage(i));
function stage(i){
  if(i===2&&needCash()&&!cur.cashOk){alarm();return}
  const km=r2(legKm);
  if(i===0){cur.timeStart=cur.timeStart||nowT();startGPS();say('sStart')}
  if(i===1){if(cur.stage===0&&km>0&&!cur.kmToLocked)cur.kmTo=km;stopGPS();say('sArrive',cur.kmTo||0);if(!cur.location)fillAddr('location')}
  if(i===2){startGPS();say('sTow')}
  if(i===3){if(cur.stage===2&&km>0&&!cur.kmTowLocked)cur.kmTow=km;stopGPS();cur.timeEnd=nowT();say('sDrop',cur.kmTow||0,price(cur).net.toFixed(0));if(!cur.destination)fillAddr('destination')}
  cur.stage=i;saveCur();fillForm();
}
function startGPS(){
  stopGPS();legKm=0;lastPos=null;
  if(!navigator.geolocation){$('#gpsStat').textContent=t('noGps');return}
  watch=navigator.geolocation.watchPosition(p=>{
    const c=p.coords;$('#gpsStat').textContent=`GPS ±${c.accuracy|0}m · ${legKm.toFixed(1)} km`;
    if(c.accuracy>60)return;
    if(lastPos){const d=hav(lastPos,c);if(d>0.015&&d<2){legKm+=d;lastPos=c}}else lastPos=c;
  },e=>$('#gpsStat').textContent='GPS: '+e.message,{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wakeLock=w).catch(()=>{})}catch(e){}
}
function stopGPS(){if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;$('#gpsStat').textContent=t('gpsOff');try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}
function hav(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.latitude-a.latitude),dn=r(b.longitude-a.longitude),h=Math.sin(dl/2)**2+Math.cos(r(a.latitude))*Math.cos(r(b.latitude))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function fillAddr(k){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(async p=>{
    const {latitude:la,longitude:lo}=p.coords;let txt=la.toFixed(5)+','+lo.toFixed(5);
    try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&accept-language=en&lat=${la}&lon=${lo}`);const j=await r.json();const a=j.address||{};txt=[[a.house_number,a.road].filter(Boolean).join(' '),a.city||a.town||a.suburb].filter(Boolean).join(', ')||j.display_name||txt}catch(e){}
    cur[k]=txt;saveCur();fillForm();toast(txt);
  },()=>toast(t('tLocNo')),{enableHighAccuracy:true,timeout:15000});
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
// iPhone home-screen apps refuse web speech ("service-not-allowed"), so there we use the keyboard's 🎤 instead
const IOS_APP=navigator.standalone===true;
let srBroken=IOS_APP||!SR;
function listen(lang,onText,btn,fallback){
  if(srBroken){fallback();return}
  let r;try{r=new SR()}catch(e){srBroken=true;fallback();return}
  r.lang=lang;r.interimResults=false;r.maxAlternatives=1;
  btn&&btn.classList.add('rec');
  r.onresult=e=>onText(normDigits(e.results[0][0].transcript));
  r.onerror=e=>{if(/not-allowed|service-not-allowed|audio-capture/.test(e.error)){srBroken=true;fallback()}else if(e.error!=='no-speech'&&e.error!=='aborted')toast('🎤 '+e.error)};
  r.onend=()=>btn&&btn.classList.remove('rec');
  try{r.start()}catch(e){srBroken=true;btn&&btn.classList.remove('rec');fallback()}
}

const NUMW={zero:0,oh:0,one:1,two:2,to:2,too:2,three:3,four:4,for:4,five:5,six:6,seven:7,eight:8,ate:8,nine:9};
function spell(s){return s.split(/\s+/).map(w=>{const l=w.toLowerCase().replace(/[^a-z0-9]/g,'');return l in NUMW?NUMW[l]:/^[a-z]{2,}$/.test(l)?(/^(dash|space|hyphen)$/.test(l)?'':l[0]):l}).join('').toUpperCase()}
const FA_WORDS={'سفید':'White','مشکی':'Black','سیاه':'Black','نقره‌ای':'Silver','نقره ای':'Silver','طوسی':'Grey','خاکستری':'Grey','قرمز':'Red','آبی':'Blue','سرمه‌ای':'Navy','سرمه ای':'Navy','سبز':'Green','زرد':'Yellow','قهوه‌ای':'Brown','قهوه ای':'Brown','طلایی':'Gold','نارنجی':'Orange','بنفش':'Purple','بژ':'Beige',
 'تویوتا':'Toyota','هوندا':'Honda','فورد':'Ford','شورلت':'Chevrolet','شورولت':'Chevrolet','نیسان':'Nissan','هیوندای':'Hyundai','هیوندا':'Hyundai','کیا':'Kia','مزدا':'Mazda','بی ام و':'BMW','بنز':'Mercedes-Benz','مرسدس':'Mercedes-Benz','فولکس':'Volkswagen','دوج':'Dodge','جیپ':'Jeep','تسلا':'Tesla','لکسوس':'Lexus','آئودی':'Audi','آودی':'Audi','سوبارو':'Subaru','جی ام سی':'GMC','رم':'RAM','کرایسلر':'Chrysler','میتسوبیشی':'Mitsubishi','آکورا':'Acura','ولوو':'Volvo','مینی':'Mini','پورشه':'Porsche','لندرور':'Land Rover','کادیلاک':'Cadillac','لینکلن':'Lincoln','بیوک':'Buick','اینفینیتی':'Infiniti',

const faTr=v=>{const k=v.trim().replace(/\s+/g,' ');return FA_WORDS[k]||v.replace(/\b\w/g,c=>c.toUpperCase())};
const KEYS=[['account','account|acct|اکانت|حساب|نوع حساب|نوع اکانت'],['make','make|brand|سازنده|برند|مارک|ماشین'],['model','model|مدل'],['colour','colou?r|رنگ'],['plate','plate|license plate|پلاک'],['vin','vin|v i n|شاسی|شماره شاسی|وین'],['reason','reason|problem|issue|علت|دلیل|مشکل|خرابی'],['location','location|pick ?up|from|مبدا|مبدأ|محل'],['destination','destination|drop ?off|to address|مقصد'],['owner','owner|consentee|customer|مالک|صاحب'],['receiver','receiver|received by|تحویل گیرنده|تحویل‌گیرنده'],['invoice','invoice|فاکتور'],['kmTo','km to vehicle|distance to vehicle|kilometers to vehicle|کیلومتر تا ماشین|کیلومتر تا خودرو|فاصله تا ماشین'],['kmTow','km towed|tow distance|towed|kilometers towed|کیلومتر حمل|مسافت حمل|کیلومتر بکسل'],['rem','rem'],['rpm','rpm'],['notes','note|notes|توضیح|توضیحات|یادداشت'],['collected','cash collected|collected|دریافتی|مبلغ دریافتی']];
const ACCT_WORDS={cash:/cash|کش|نقد/i,basic:/basic|بیسیک|بیسیک/i,plus:/plus|پلاس/i,premium:/premi(um|er)|پریمیوم|پرمیوم|پریمیر/i};
const B='(?<![\\p{L}\\p{N}])',E='(?![\\p{L}\\p{N}])';
function parseVoice(s){
  s=normDigits(s);
  const re=new RegExp(B+'('+KEYS.map(k=>k[1]).join('|')+')'+E,'giu');const hits=[];let m;
  while((m=re.exec(s)))hits.push({i:m.index,end:re.lastIndex,w:m[1]});
  let n=0;
  hits.forEach((h,j)=>{
    const key=KEYS.find(k=>new RegExp('^('+k[1]+')$','iu').test(h.w));if(!key)return;
    let v=s.slice(h.end,j+1<hits.length?hits[j+1].i:undefined).replace(/^[\s:,.،-]+|[\s,.،]+$/g,'');if(!v)return;
    const k=key[0];
    if(k==='account'){const a=Object.keys(ACCT_WORDS).find(a=>ACCT_WORDS[a].test(v));if(a){cur.account=a;n++}return}
    if(k==='reason'){const best=matchReason(v);cur.reason=best||'Other';if(!best)cur.notes=(cur.notes?cur.notes+'; ':'')+v;n++;return}
    if(k==='plate'||k==='vin')v=spell(v);
    if(['kmTo','kmTow','collected'].includes(k)){v=(v.match(/[\d.]+/)||[''])[0];if(k!=='collected')cur[k+'Locked']=true}
    if(k==='colour'||k==='make'||k==='model')v=faTr(v);
    cur[k]=v;n++;
  });
  saveCur();fillForm();if(needCash()&&!cur.cashOk&&hits.some(h=>/account|acct|اکانت|حساب/i.test(h.w)))alarm();return n;
}
const FA_REASON={'پنچر':1,'باتری':3,'روشن نمی':3,'موتور':4,'جوش':5,'گیربکس':6,'ترمز':7,'برق':8,'بنزین':9,'سوخت':9,'فرمان':11,'جلوبندی':11,'اکسل':12,'تایم':13,'کلاچ':14,'نشتی':15,'سوئیچ':16,'سوییچ':16,'گیر':18,'برف':18,'گل':18,'وینچ':18,'آتش':19,'آب':20,'سرقت':21,'دزدی':21,'توقیف':22,'پارک':22,'تعمیرگاه':24,'نمایندگی':24,'تصادف':0};
function matchReason(v){
  const lv=v.toLowerCase();
  for(const [w,i] of Object.entries(FA_REASON))if(lv.includes(w))return REASONS[i][0];
  let best='',sc=0;REASONS.forEach(([r])=>{const w=r.toLowerCase().split(/[^a-z]+/).filter(x=>x.length>2);const s=w.filter(x=>lv.includes(x.replace(/s$/,''))).length;if(s>sc){sc=s;best=r}});return best;
}

// ---------- OCR helpers ----------
let tess;
// the text reader (tesseract.js) is hosted with the app in ocr/, so it works without any CDN and offline after first use
let ocrPct=null;
async function ocr(blob,onPct){
  ocrPct=onPct;
  if(!tess)tess=(async()=>{
    if(!window.Tesseract)await new Promise((res,rej)=>{const s=document.createElement('script');s.src='ocr/tesseract.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
    const base=new URL('ocr/',location.href).href;
    return Tesseract.createWorker('eng',1,{workerPath:base+'worker.min.js',corePath:base,langPath:base,gzip:true,workerBlobURL:false,
      logger:m=>ocrPct&&m.progress!=null&&ocrPct(m.status,Math.round(m.progress*100))});
  })();
  let w;try{w=await tess}catch(e){tess=null;throw e}
  const job=w.recognize(blob);
  return (await Promise.race([job,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),90000))])).data.text;
}
// grayscale + contrast stretch at up to 2000px: plates and badges read much better

  const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);const d=g.getImageData(0,0,c.width,c.height),px=d.data;let lo=255,hi=0;

// pull plate, VIN, make and model (from rear badges) out of OCR text
function readVehicleText(raw){

    if(v.length===17&&(v.match(/[0-9]/g)||[]).length>=5){out.vin=v.replace(/O/g,'0').replace(/[IQ]/g,'1');break}}
  const has=w=>new RegExp('(^|[^A-Z0-9])'+w.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[\s\-]/g,'[\\s\\-]?')+'(?![A-Z0-9])').test(T);
  const mk=MAKES.find(m=>has(m))||(has('CHEVY')?'Chevrolet':has('VW')?'Volkswagen':has('MERCEDES')?'Mercedes-Benz':'');
  const pool=mk?CARS[mk].map(x=>[mk,x]):MAKES.flatMap(m=>CARS[m].map(x=>[m,x]));
  const md=pool.filter(([,x])=>x.replace(/[\s\-]/g,'').length>=3&&has(x)).sort((a,b)=>b[1].length-a[1].length)[0]

    if(skip.has(cand)||(out.vin&&out.vin.includes(cand)))continue;
    if(/^[A-Z]{4}[0-9]{3}$|^[A-Z]{3}[0-9]{3,4}$|^[0-9]{3}[A-Z]{3}$|^[A-Z]{2}[0-9]{2}[A-Z]{2}$|^[0-9][A-Z]{2}[0-9]{3}$/.test(cand)){plate=cand;break}}}

function applyDispatch(txt){

  if(o.notes&&!cur.notes?.includes(o.notes))cur.notes=((cur.notes||'')+' '+o.notes).trim();

async function takeShared(){
  if(!/[?&]share/.test(location.search)||!window.caches)return;
  history.replaceState(null,'',location.pathname);
  const c=await caches.open('towlog-share'),tx=await c.match('text'),im=await c.match('image');

function periods(){

  const dates=calls.map(c=>new Date(c.date+'T00:00:00')).concat([new Date()]);
  const i0=Math.floor((Math.min(...dates)-a)/(14*DAY)),i1=Math.floor((Math.max(...dates)-a)/(14*DAY));
  for(let i=i1;i>=i0;i--){const s=new Date(+a+i*14*DAY+3*36e5),e=new Date(+s+13*DAY);out.push([iso(s),iso(e)])}
  return out;
}

  const fmt=(k,v)=>['calls','kmTo','kmTow'].includes(k)?v:(+v).toFixed(2);
  dailyRows=days.map(d=>({date:d,...dRow(rows.filter(r=>r.date===d))}));const dt=dRow(rows);
  $('#repDaily').innerHTML=`<table><thead><tr><th>${t('dDate')}</th>${DC.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${dailyRows.map(r=>`<tr><td dir="ltr" style="white-space:nowrap">${r.date} <small>${new Date(r.date+'T12:00').toLocaleDateString('en-CA',{weekday:'short'})}</small></td>${DC.map(([k])=>`<td class="num">${fmt(k,r[k])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${DC.length+1}">${t('noCallsPeriod')}</td></tr>`}</tbody>
  <tfoot><tr><td>${t('total')} · ${days.length} ${t('dDays')}</td>${DC.map(([k])=>`<td class="num">${fmt(k,dt[k])}</td>`).join('')}</tr></tfoot></table>`;
  $('#repTbl').innerHTML=`<table><thead><tr>${COLS.map(c=>`<th>${lb(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${COLS.map(([k])=>`<td dir="auto">${esc(MONEY.includes(k)?r[k].toFixed(2):r[k]??'')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${COLS.length}">${t('noCallsPeriod')}</td></tr>`}</tbody>
  <tfoot><tr>${COLS.map(([k],i)=>`<td>${i===0?`${t('total')} (${rows.length})`:SUMC.has(k)?(MONEY.includes(k)||k==='collected'?sum(k).toFixed(2):sum(k)):''}</td>`).join('')}</tr></tfoot></table>`;
}
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#period').onchange=renderReport;
// tap a row to keep track of it
document.addEventListener('click',e=>{const tr=e.target.closest('.tbl tbody tr');if(tr)tr.classList.toggle('sel')});
$('#printBtn').onclick=()=>print();
// CSV stays in English so it matches the company's paper runsheet
$('#csvBtn').onclick=()=>{const [s,e]=$('#period').value.split('|'),rows=repRows(s,e,1);
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  renderReport();const DK=['date','calls','kmTo','kmTow','net','hst','classic','driver','driverHst','golden','collected'];
  const csv=[COLS.map(c=>q(c[1])).join(','),...rows.map(r=>COLS.map(([k])=>q(MONEY.includes(k)?r[k].toFixed(2):r[k])).join(',')),'','"Daily financial summary"',
    ['Date','Calls','Km to veh','Km towed','Total net','HST','Classic Towing','Driver','Driver HST','Golden Gate Towing','Cash collected'].map(q).join(','),
    ...dailyRows.map(r=>DK.map(k=>q(['date','calls','kmTo','kmTow'].includes(k)?r[k]:(+r[k]).toFixed(2))).join(','))].join('\r\n');
  dl(new Blob(['﻿'+csv],{type:'text/csv'}),`runsheet_${s}_${e}.csv`)};
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}

function checkReport(){
  const last=periods().find(([,e])=>e<today());if(!last)return;
  const key=last.join('|');if(LS.get('tl_seen','')===key||!calls.some(c=>c.date>=last[0]&&c.date<=last[1]))return;
  const b=$('#reportBanner');b.classList.remove('hide');
  b.innerHTML=`📊 <b>${t('repReady')}</b> <span class="ltr" style="display:inline-block">(${last[0]} → ${last[1]})</span> <button class="btn acc" id="openRep">${t('open')}</button>`;
  $('#openRep').onclick=()=>{LS.set('tl_seen',key);b.classList.add('hide');show('rep');$('#period').value=key;renderReport()};
  say('sRep');
}

// ---------- settings ----------
function fillSet(){[...SET,...RATES,['email'],['mailCall'],['mailWeek'],['mailBk']].forEach(([k])=>$('#s_'+k).value=S[k]??'');$('#s_ui').value=S.ui;$('#s_lang').value=S.lang;$('#s_speak').value=S.speak}
function checkBackup(){
  const last=LS.get('tl_bk',0);if(!calls.length||Date.now()-last<7*864e5)return;
  const b=document.createElement('div');b.className='banner';b.innerHTML=`💾 <b>${t('bkRemind')}</b> <button class="btn acc" id="bkNow">${t('exp')}</button>`;
  $('#v-home').prepend(b);$('#bkNow').onclick=()=>{$('#expBtn').click();b.remove()};
}
// ---------- database file (backup / load) ----------
async function backupBlob(withPhotos){
  const photos={};
  if(withPhotos)for(const c of calls)for(const id of c.photos||[]){const b=await getPhoto(id).catch(()=>null);if(b)photos[id]=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
  return new Blob([JSON.stringify({v:1,saved:Date.now(),calls,settings:S,photos})],{type:'application/json'});
}
const bkName=()=>`towlog_database_${today()}_${nowT().replace(':','')}.json`;
// on phones this opens the share sheet → "Save to Files" (iCloud Drive) or Google Drive; elsewhere it downloads
async function saveDbFile(){
  LS.set('tl_bk',Date.now());const f=new File([await backupBlob(true)],bkName(),{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'TowLog database'});return true}}catch(e){if(e.name==='AbortError')return false}
  dl(f,f.name);return true;
}
$('#expBtn').onclick=saveDbFile;
$('#impBtn').onclick=()=>$('#impIn').click();
// merge: a call from the file replaces the phone's copy only when it was saved later
async function loadDb(j){
  for(const [id,d] of Object.entries(j.photos||{}))await putPhoto(id,await (await fetch(d)).blob());
  let n=0;(j.calls||[]).forEach(c=>{const i=calls.findIndex(x=>x.id===c.id);if(i<0){calls.push(c);n++}else if((c.saved||0)>(calls[i].saved||0)){calls[i]=c;n++}});
  const keep={email:S.email,ui:S.ui};Object.assign(S,j.settings||{});if(!S.email)S.email=keep.email;
  saveCalls();saveSet();buildUI();fillSet();renderLog();LS.set('tl_loaded',Date.now());return n;
}
$('#impIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());if(!Array.isArray(j.calls))throw 0;const n=await loadDb(j);toast(`${t('tImported')} (${n})`);shiftStat()}catch(err){toast(t('tBadBackup'))}};

// ---------- start / end shift ----------
function shiftStat(){const a=LS.get('tl_bk',0),l=LS.get('tl_loaded',0),q=LS.get('tl_out',[]).length;
  $('#shiftStat').textContent=`${t('lastBk')}: ${a?new Date(a).toLocaleString():'—'} · ${t('nCalls')}: ${calls.length}`+(q?` · ✉️ ${q} ${t('pending')}`:'')}
$('#shiftStart').onclick=()=>{$('#startModal').classList.add('show')};
$('#smLoad').onclick=()=>{$('#startModal').classList.remove('show');LS.set('tl_shift',Date.now());$('#impIn').click()};
$('#smGo').onclick=()=>{$('#startModal').classList.remove('show');LS.set('tl_shift',Date.now());toast(t('shiftOn'));say('sShift');flushMail();checkWeekly()};
$('#shiftEnd').onclick=async()=>{
  if(!calls.find(c=>c.id===cur.id)&&(cur.make||cur.plate||cur.account)&&!confirm(t('tUnsaved')))return;
  stopGPS();
  // the share sheet must open straight from the tap, so the file goes first and the emails after
  const ok=await saveDbFile();LS.set('tl_shift',0);
  toast(ok?t('shiftOff'):t('tSaved'));say('sShiftEnd');
  if(mailOn()&&S.mailBk!=='0')await mailBackup();
  await flushMail();await checkWeekly();shiftStat();
};

// ---------- email: each call, weekly Excel, end-of-shift backup (via FormSubmit) ----------
const MAIL='https://formsubmit.co/';
const mailOn=()=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.email||'');
function queueMail(job){if(!mailOn()||S.mailCall==='0')return;const q=LS.get('tl_out',[]).filter(j=>!(j.type===job.type&&j.id===job.id));q.push(job);LS.set('tl_out',q);flushMail()}
function callFields(c){const p=price(c),o={};
  COLS.forEach(([k,en])=>{let v=['net','hst','total'].includes(k)?p[k].toFixed(2):(k==='account'?an(c.account,1):c[k]);if(k==='kmTo')v=p.kmTo;if(k==='kmTow')v=p.kmTow;if(v!==''&&v!=null)o[en]=String(v)});
  if(c.notes)o.Notes=c.notes;o.Driver=[S.driverName,S.driverNo&&'#'+S.driverNo,S.truckNo&&'Truck '+S.truckNo].filter(Boolean).join(' ');return o}
async function postJSON(d,keepalive){const r=await fetch(MAIL+'ajax/'+encodeURIComponent(S.email),{method:'POST',keepalive:!!keepalive,headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({...d,_template:'table',_captcha:'false'})});
  const j=await r.json().catch(()=>({}));if(!r.ok||String(j.success)==='false')throw new Error(j.message||r.status);return j}
let flushing=false;
async function flushMail(keepalive){
  if(flushing||!mailOn()||!navigator.onLine)return;flushing=true;
  try{let q=LS.get('tl_out',[]);
    for(const job of q.slice()){const c=calls.find(x=>x.id===job.id);
      if(c)try{await postJSON({_subject:`TowLog ${job.upd?'(updated) ':''}call ${c.date} ${c.timeStart||''} · ${[c.make,c.model,c.plate].filter(Boolean).join(' ')} · ${$f(price(c).net)}`,...callFields(c)},keepalive)}catch(e){$('#mailStat').textContent='✉️ '+e.message;break}
      q=q.filter(j=>j!==job);LS.set('tl_out',q)}
  }finally{flushing=false;shiftStat()}
}
// attachments go through a normal form post into a hidden frame (FormSubmit's documented upload path)
function postWithFile(fields,file){return new Promise(res=>{
  const f=document.createElement('form');f.method='POST';f.action=MAIL+encodeURIComponent(S.email);f.enctype='multipart/form-data';f.target='mailFrame';f.className='hide';
  Object.entries({...fields,_template:'table',_captcha:'false'}).forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;f.appendChild(i)});
  try{const dt=new DataTransfer();dt.items.add(file);const i=document.createElement('input');i.type='file';i.name='attachment';i.files=dt.files;f.appendChild(i)}catch(e){}
  document.body.appendChild(f);let done=false;const fin=()=>{if(done)return;done=true;f.remove();res()};
  $('#mailFrame').onload=fin;setTimeout(fin,20000);f.submit()})}
function csvOf(rows){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  return '\ufeff'+[COLS.map(c=>q(c[1])).join(','),...rows.map(r=>COLS.map(([k])=>q(MONEY.includes(k)?r[k].toFixed(2):r[k])).join(','))].join('\r\n')}
// weekly report (Mon–Sun) is sent the first time the app runs after the week ends
async function checkWeekly(){
  if(!mailOn()||S.mailWeek==='0'||!navigator.onLine)return;
  const mon=new Date(mondayOf(new Date())+'T12:00:00');mon.setDate(mon.getDate()-7);const s=iso(mon),e=new Date(mon);e.setDate(e.getDate()+6);const en=iso(e);
  if(LS.get('tl_wk','')===s)return;const rows=repRows(s,en,1);if(!rows.length){LS.set('tl_wk',s);return}
  const sum=k=>r2(rows.reduce((a,r)=>a+(+r[k]||0),0));
  await postWithFile({_subject:`TowLog weekly report ${s} → ${en}`,Period:`${s} → ${en}`,Driver:S.driverName||'',Calls:rows.length,'Total net (excl. HST)':sum('net').toFixed(2),HST:sum('hst').toFixed(2),'Total invoice':sum('total').toFixed(2),'Cash collected':sum('collected').toFixed(2),'Km to vehicle / towed':`${sum('kmTo')} / ${sum('kmTow')}`},
    new File([csvOf(rows)],`TowLog_week_${s}_${en}.csv`,{type:'text/csv'}));
  LS.set('tl_wk',s);toast(t('wkSent'));
}
async function mailBackup(){
  if(!navigator.onLine)return;const d=today(),todays=calls.filter(c=>c.date===d);
  await postWithFile({_subject:`TowLog end of shift ${d} · ${todays.length} calls · ${$f(r2(todays.reduce((a,c)=>a+price(c).net,0)))}`,Date:d,'Calls today':todays.length,'Calls in database':calls.length,Note:'Attached: TowLog database (without photos). To restore: TowLog → Start shift → Load database.'},
    new File([await backupBlob(false)],bkName(),{type:'application/json'}));
}
$('#mailTest').onclick=async()=>{if(!mailOn()){toast(t('mailBad'));return}$('#mailStat').textContent=t('fbSending');
  try{await postJSON({_subject:'TowLog test email',Message:'Your TowLog emails are working.'});$('#mailStat').textContent=t('mailOk')}catch(e){$('#mailStat').textContent='✉️ '+e.message}};
// leaving the app: push any unsent call emails (small, so they fit in a keepalive request)
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushMail(true);else{flushMail();checkWeekly()}});
addEventListener('online',()=>flushMail());

// ---------- feedback (FormSubmit relays the form to the owner's inbox; mail app as fallback) ----------
const FEEDBACK_TO='m.f.atipey@gmail.com';
let fbRate=0;
function renderStars(){$('#fb_stars').innerHTML=[1,2,3,4,5].map(n=>`<button type="button" data-s="${n}" class="${n<=fbRate?'on':''}">★</button>`).join('')}
$('#fb_stars').onclick=e=>{const n=+e.target.dataset.s;if(n){fbRate=n;renderStars()}};
$('#fbForm').onsubmit=async e=>{
  e.preventDefault();const msg=$('#fb_msg').value.trim();if(!msg){$('#fbStatus').textContent=t('fbEmpty');return}
  const d={name:$('#fb_name').value.trim(),email:$('#fb_email').value.trim(),type:$('#fb_type').value,rating:fbRate?fbRate+'/5':'',message:msg,
    app:'TowLog '+(navigator.userAgent.match(/Android|iPhone|iPad|Windows|Mac/)||[''])[0],_subject:'TowLog feedback: '+$('#fb_type').value,_template:'table',_captcha:'false'};
  if(!d.email)delete d.email;
  $('#fbSend').disabled=true;$('#fbStatus').textContent=t('fbSending');
  try{const r=await fetch('https://formsubmit.co/ajax/'+FEEDBACK_TO,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(d)});
    const j=await r.json().catch(()=>({}));if(!r.ok||String(j.success)==='false')throw 0;
    $('#fbStatus').textContent=t('fbOk');$('#fb_msg').value='';fbRate=0;renderStars();
  }catch(err){
    $('#fbStatus').textContent=t('fbFail')+' '+FEEDBACK_TO;
    location.href=`mailto:${FEEDBACK_TO}?subject=${encodeURIComponent(d._subject)}&body=${encodeURIComponent(`${d.type} ${d.rating}\n${d.name||''} ${d.email||''}\n\n${msg}`)}`;
  }finally{$('#fbSend').disabled=false}
};

// ---------- nav ----------
function show(v){$$('main>section').forEach(s=>s.classList.toggle('hide',s.id!=='v-'+v));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#voiceAll').classList.toggle('hide',v!=='call');if(v==='home'){renderHome();shiftStat()}if(v==='log')renderLog();if(v==='rep')renderReport();if(v==='set')fillSet();scrollTo(0,0)}
$$('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
let tt;function toast(m){const el=$('#toast');el.textContent=m;el.style.display='block';clearTimeout(tt);tt=setTimeout(()=>el.style.display='none',3500)}

buildUI();show(isDraft()?'call':'home');checkReport();checkBackup();takeShared();shiftStat();flushMail();checkWeekly();
// fresh install (no calls on this phone): offer to load the database first
if(!calls.length)$('#startModal').classList.add('show');
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
