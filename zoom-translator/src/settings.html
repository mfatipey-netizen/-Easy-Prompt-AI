<meta charset="utf-8">
<title>تنظیمات — Zoom Persian Subtitles</title>
<style>
  body { font-family: 'Vazirmatn','Tahoma',sans-serif; direction: rtl; margin: 0; padding: 20px; background: #1e1e24; color: #eee; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.hint { font-size: 12px; color: #aaa; margin: 0 0 18px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; color: #ddd; }
  input[type=text], input[type=password], select { width: 100%; box-sizing: border-box; padding: 8px 10px; background: #2a2a33; border: 1px solid #3a3a44; color: #fff; border-radius: 6px; font-size: 13px; direction: ltr; text-align: left; }
  select { direction: rtl; text-align: right; }
  input[type=color] { width: 60px; height: 32px; background: transparent; border: 1px solid #3a3a44; border-radius: 6px; cursor: pointer; }
  .row { display: flex; gap: 12px; align-items: center; }
  .row > * { flex: 1; }
  .save { margin-top: 22px; background: #4a7bff; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; }
  .save:hover { background: #3a6be5; }
  .ok { color: #7dff9a; font-size: 12px; margin-right: 8px; }
  a { color: #7ab6ff; }
  small { color: #999; font-size: 11px; display: block; margin-top: 3px; }
</style>
<h1>تنظیمات</h1>
<p class="hint">کلیدهای API روی همین دستگاه رمزنگاری‌شده ذخیره می‌شوند و به هیچ سروری ارسال نمی‌شوند.</p>

<label>کلید Deepgram API <small><a href="https://console.deepgram.com/signup" target="_blank">console.deepgram.com</a> — ۲۰۰$ اعتبار رایگان</small></label>
<input type="password" id="deepgramKey" placeholder="کلید API خود را وارد کنید">

<label>کلید Anthropic API <small><a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a> — برای ترجمه با Claude Haiku 4.5</small></label>
<input type="password" id="anthropicKey" placeholder="sk-ant-...">

<label>زبان مبدأ (چیزی که می‌شنوی)</label>
<select id="sourceLang">
  <option value="en">انگلیسی</option>
  <option value="multi">چندزبانه (تشخیص خودکار)</option>
  <option value="es">اسپانیایی</option>
  <option value="fr">فرانسه</option>
  <option value="de">آلمانی</option>
  <option value="ar">عربی</option>
  <option value="tr">ترکی</option>
  <option value="ru">روسی</option>
  <option value="zh">چینی</option>
  <option value="ja">ژاپنی</option>
</select>

<div class="row">
  <div>
    <label>اندازهٔ فونت</label>
    <input type="text" id="fontSize" value="28">
  </div>
  <div>
    <label>شفافیت پس‌زمینه (0–1)</label>
    <input type="text" id="opacity" value="0.75">
  </div>
</div>

<div class="row">
  <div>
    <label>رنگ متن</label>
    <input type="color" id="textColor" value="#ffffff">
  </div>
  <div>
    <label>رنگ پس‌زمینه</label>
    <input type="color" id="bgColor" value="#000000">
  </div>
  <div>
    <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="showOriginal"> نمایش متن انگلیسی</label>
  </div>
</div>

<button class="save" id="save">ذخیره <span class="ok" id="ok"></span></button>

<script>
async function load() {
  const cfg = await window.api.getConfig();
  document.getElementById('deepgramKey').value = cfg.deepgramKey || '';
  document.getElementById('anthropicKey').value = cfg.anthropicKey || '';
  document.getElementById('sourceLang').value = cfg.sourceLang || 'en';
  document.getElementById('fontSize').value = cfg.fontSize ?? 28;
  document.getElementById('opacity').value = cfg.opacity ?? 0.75;
  document.getElementById('textColor').value = cfg.textColor || '#ffffff';
  document.getElementById('bgColor').value = cfg.bgColor || '#000000';
  document.getElementById('showOriginal').checked = !!cfg.showOriginal;
}
document.getElementById('save').onclick = async () => {
  const cfg = {
    deepgramKey: document.getElementById('deepgramKey').value.trim(),
    anthropicKey: document.getElementById('anthropicKey').value.trim(),
    sourceLang: document.getElementById('sourceLang').value,
    fontSize: parseInt(document.getElementById('fontSize').value, 10) || 28,
    opacity: Math.max(0, Math.min(1, parseFloat(document.getElementById('opacity').value) || 0.75)),
    textColor: document.getElementById('textColor').value,
    bgColor: document.getElementById('bgColor').value,
    showOriginal: document.getElementById('showOriginal').checked,
  };
  await window.api.setConfig(cfg);
  const ok = document.getElementById('ok');
  ok.textContent = '✓ ذخیره شد';
  setTimeout(() => ok.textContent = '', 1500);
};
load();
</script>
