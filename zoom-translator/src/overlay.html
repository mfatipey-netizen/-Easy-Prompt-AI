<meta charset="utf-8">
<title>Zoom Persian Subtitles</title>
<style>
  /* Everything is click-through by default. Only elements marked `.hit`
     accept the cursor — the toolbar and the caption pill. Zoom underneath
     receives all other clicks so the meeting UI stays fully usable. */
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: 'Vazirmatn', 'IRANSans', 'Tahoma', sans-serif; user-select: none; -webkit-user-select: none;
    pointer-events: none; }
  .hit { pointer-events: auto; }
  #root { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; padding-bottom: 12px; }
  #bar { -webkit-app-region: drag; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; margin: 0 16px 8px; background: rgba(0,0,0,0.55); color: #fff; font-size: 13px;
    border-radius: 10px; opacity: 0.35; transition: opacity .15s; backdrop-filter: blur(4px); }
  #bar:hover { opacity: 1; }
  #bar .btns { -webkit-app-region: no-drag; display: flex; gap: 8px; flex-wrap: wrap; }
  #bar button { background: rgba(255,255,255,0.18); border: 0; color: #fff; padding: 7px 14px;
    border-radius: 7px; cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 500; }
  #bar button:hover { background: rgba(255,255,255,0.32); }
  #bar button:disabled { opacity: 0.4; cursor: default; }
  #status { color: #ffd76a; font-size: 12px; min-width: 120px; }
  #captions { display: flex; flex-direction: column; align-items: center;
    padding: 0 16px; direction: rtl; text-align: center; gap: 6px; }
  .line { max-width: 100%; padding: 6px 14px; border-radius: 10px; line-height: 1.5;
    background: var(--bg, rgba(0,0,0,0.75)); color: var(--fg, #fff); font-size: var(--fs, 28px);
    text-shadow: 0 1px 3px rgba(0,0,0,0.9); word-wrap: break-word; pointer-events: auto; }
  .interim { opacity: 0.6; }
  .original { font-size: 0.55em; direction: ltr; color: #cfe8ff; }
  /* File-mode playback bar — visible only when a local file is loaded. */
  #playbar { -webkit-app-region: no-drag; display: none; align-items: center; gap: 10px;
    margin: 0 16px 8px; padding: 6px 12px; background: rgba(0,0,0,0.65); color: #fff;
    border-radius: 10px; font-size: 12px; direction: ltr; }
  #playbar.on { display: flex; }
  #playbar button { background: rgba(255,255,255,0.18); border: 0; color: #fff;
    padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: inherit; }
  #playbar button:hover { background: rgba(255,255,255,0.32); }
  #seek { flex: 1; height: 4px; cursor: pointer; }
  #rate { background: rgba(255,255,255,0.18); color: #fff; border: 0; border-radius: 6px;
    padding: 4px 6px; font-family: inherit; font-size: 12px; }
  #ftitle { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    opacity: 0.75; direction: ltr; }
</style>
<div id="root">
  <div id="bar" class="hit">
    <div id="status">در حال آماده‌سازی…</div>
    <div class="btns">
      <button id="mic">شروع</button>
      <button id="file" title="بازکردن فایل ویدیویی/صوتی و ترجمهٔ صدایش">📁 فایل</button>
      <button id="srt" disabled title="ذخیرهٔ زیرنویس‌ها به‌صورت SRT">💾 SRT</button>
      <button id="less">A−</button>
      <button id="more">A+</button>
      <button id="through">قفل</button>
      <button id="settings">تنظیمات</button>
      <button id="hide">پنهان</button>
      <button id="quit" style="background:rgba(255,80,80,0.35);">بستن</button>
    </div>
  </div>
  <div id="playbar" class="hit">
    <button id="playpause">⏸</button>
    <span id="curtime">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" step="1">
    <span id="durtime">0:00</span>
    <select id="rate" title="سرعت پخش">
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2×</option>
    </select>
    <span id="ftitle"></span>
    <button id="closefile" title="بستن فایل">✕</button>
  </div>
  <div id="captions">
    <div class="line" id="line">برای شروع، کلید API را در تنظیمات وارد کن.</div>
  </div>
</div>
<!-- Hidden media element used in file mode. Audio is routed through
     MediaElementSource → same Deepgram/Claude pipeline as live mode. -->
<video id="player" style="display:none;" preload="auto"></video>
<script src="overlay.js"></script>
